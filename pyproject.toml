[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "offline-voice-agent"
version = "0.1.0"
description = "A fully local, privacy-preserving voice agent for a clinic front desk: streaming pipeline, guardrails, evals, observability and human-in-the-loop controls."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "websockets>=12.0",
  "pydantic>=2.6",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
stt = ["faster-whisper>=1.0", "numpy>=1.26"]
tts = ["pyttsx3>=2.90"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
voice-agent = "voice_agent.server:main"
voice-agent-sim = "voice_agent.sim:main"
voice-agent-evals = "voice_agent.evals.__main__:main"
voice-agent-bench = "voice_agent.bench:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["voice_agent", "helpers"]
