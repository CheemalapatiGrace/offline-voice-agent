name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Unit and integration tests (fully offline)
        run: pytest
      - name: Eval gate (fails below thresholds)
        run: python -m voice_agent.evals
      - name: Benchmark smoke
        run: python -m voice_agent.bench --sessions 20 --turns 3
