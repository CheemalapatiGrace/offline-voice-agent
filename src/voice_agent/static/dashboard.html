<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Operator console · Front Desk Voice</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e6b73'/%3E%3Cpath d='M7 13v6M12 9v14M17 5v22M22 10v12M26 14v4' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f5f7; --surface:#fff; --sunk:#eceef2; --line:#dcdfe5; --line-strong:#c6cbd3;
  --tx:#161e28; --mut:#566271; --faint:#5f6b7a;
  --brand:#0e6b73; --brand-hi:#0a5860; --brand-tint:#e2f1f2; --on-brand:#fff;
  --ok:#1d7a45; --ok-tint:#e3f3ea; --warn:#8f5a00; --warn-tint:#fbefd7; --bad:#b3261e; --bad-tint:#fbe5e3;
  --hold:#5f43b8; --hold-tint:#ece8f9; --info:#1f5fa8; --info-tint:#e3edf8;
  --shadow:0 1px 2px rgba(22,30,40,.06),0 8px 24px -12px rgba(22,30,40,.18);
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Iowan Old Style","New York","Charter","Source Serif Pro",Georgia,serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#0d1216; --surface:#141b21; --sunk:#0a0e11; --line:#25303a; --line-strong:#34414d;
  --tx:#e6ebf0; --mut:#9aa7b4; --faint:#7d8a97;
  --brand:#5cc8d0; --brand-hi:#7fd6dc; --brand-tint:#12282b; --on-brand:#06242a;
  --ok:#5fcb8d; --ok-tint:#12261c; --warn:#e3a33b; --warn-tint:#2a2110; --bad:#f07a72; --bad-tint:#2e1614;
  --hold:#aa98f2; --hold-tint:#1e1a33; --info:#7db3ec; --info-tint:#11233a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 28px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 var(--sans);font-variant-numeric:tabular-nums;min-height:100vh}
::selection{background:var(--brand);color:var(--on-brand)}
input,textarea,select{caret-color:var(--brand)}
*{scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;z-index:20;background:var(--brand);color:var(--on-brand);padding:8px 14px;border-radius:8px;font-weight:600;text-decoration:none}
.skip:focus{top:12px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:15px;height:15px}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:20px;padding:18px 14px;background:var(--surface);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px;font-weight:650;font-size:15px;letter-spacing:-.01em;line-height:1.2}
.mark{width:30px;height:30px;border-radius:8px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;flex:none}
.mark svg.i{stroke-width:2.2}
.brand small{display:block;font-weight:400;color:var(--mut);font-size:12px;margin-top:1px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;border-radius:8px;background:none;color:var(--mut);text-align:left;cursor:pointer;transition:background .15s,color .15s}
.nav button:hover{background:var(--sunk);color:var(--tx)}
.nav button[aria-current=page]{background:var(--brand-tint);color:var(--brand);font-weight:600}
.nav .count{margin-left:auto;background:var(--hold);color:#fff;border-radius:999px;padding:0 7px;font-size:11px;font-weight:600;line-height:18px}
:root[data-theme=dark] .nav .count{color:#14102a}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.access{border:1px solid var(--line);border-radius:10px}
.access summary{display:flex;align-items:center;gap:8px;padding:9px 10px;cursor:pointer;color:var(--mut);list-style:none;border-radius:10px}
.access summary::-webkit-details-marker{display:none}
.access summary b{color:var(--tx);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.access[open] summary{border-bottom:1px solid var(--line);border-radius:10px 10px 0 0}
.access .body{display:flex;flex-direction:column;gap:10px;padding:10px}
.tools{display:flex;gap:6px}
.tools button,.tools a{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:none;cursor:pointer;color:var(--mut);font-size:12.5px;text-decoration:none}
.tools button:hover,.tools a:hover{color:var(--tx);border-color:var(--line-strong)}
.link-state{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut);padding:0 4px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.link-state.ok .dot{background:var(--ok)}
.link-state.down .dot{background:var(--bad)}
.link-state.wait .dot{background:var(--warn)}
.link-state.ok .dot{animation:pulse 2.4s infinite}
@keyframes pulse{50%{opacity:.35}}

main{padding:28px clamp(16px,2.6vw,40px) 64px;min-width:0}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 24px;flex-wrap:wrap;margin-bottom:20px}
h1{font:600 clamp(24px,2.4vw,30px)/1.15 var(--serif);letter-spacing:-.01em;margin:0;text-wrap:balance}
.sub{color:var(--mut);margin:6px 0 0;max-width:60ch;text-wrap:pretty}
h2{font-size:13px;font-weight:650;margin:0}
h3{margin:0;font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.pad{padding:16px}
.mut{color:var(--mut)}.faint{color:var(--faint)}
.mono{font-family:var(--mono);font-size:12.5px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.clip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:0 14px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:600;transition:background .15s,border-color .15s,transform .1s;white-space:nowrap}
.btn:hover{border-color:var(--tx)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-hi);border-color:var(--brand-hi)}
.btn.hold{background:var(--hold);border-color:var(--hold);color:#fff}
:root[data-theme=dark] .btn.hold{color:#14102a}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.danger:hover{background:var(--bad-tint);border-color:var(--bad)}
.btn.sm{min-height:32px;padding:0 11px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default;pointer-events:none}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:13px}
.field small{color:var(--mut)}
input[type=text],input[type=password],textarea{width:100%;padding:9px 12px;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface);color:var(--tx);font:inherit}
input:disabled{background:var(--sunk);cursor:not-allowed}
textarea{min-height:76px;resize:vertical;line-height:1.5}
input::placeholder,textarea::placeholder{color:var(--faint)}
.switch{display:inline-flex;align-items:center;gap:9px;cursor:pointer;color:var(--mut);font-size:13px}
.switch input{appearance:none;width:34px;height:20px;border-radius:999px;background:var(--line-strong);position:relative;margin:0;cursor:pointer;transition:background .2s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .2s var(--ease)}
.switch input:checked{background:var(--brand)}
.switch input:checked::after{transform:translateX(14px)}
.switch input:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* status */
.st{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--mut)}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.listening,.st.idle{background:var(--brand-tint);color:var(--brand)}
.st.thinking{background:var(--info-tint);color:var(--info)}
.st.speaking{background:var(--ok-tint);color:var(--ok)}
.st.paused{background:var(--warn-tint);color:var(--warn)}
.st.takeover{background:var(--hold-tint);color:var(--hold)}
.st.handoff{background:var(--bad-tint);color:var(--bad)}
.st.disconnected{background:var(--sunk);color:var(--mut)}
.st.thinking::before,.st.speaking::before,.st.listening::before,.st.idle::before{animation:pulse 1.6s infinite}
.st.lg{font-size:13.5px;padding:4px 13px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:6px;background:var(--sunk);color:var(--mut);font-size:12px;border:1px solid var(--line);white-space:nowrap}
.tag.hold{background:var(--hold-tint);color:var(--hold);border-color:transparent}
.tag.bad{background:var(--bad-tint);color:var(--bad);border-color:transparent}
.tag.warn{background:var(--warn-tint);color:var(--warn);border-color:transparent}
.tag.ok{background:var(--ok-tint);color:var(--ok);border-color:transparent}

/* summary numbers */
.stats{display:flex;flex-wrap:wrap;gap:8px 0}
.stats div{padding:0 22px 0 0;margin-right:22px;border-right:1px solid var(--line)}
.stats div:last-child{border:0;margin:0;padding:0}
.stats b{display:block;font:600 22px/1.2 var(--serif)}
.stats span{font-size:12.5px;color:var(--mut)}

/* approvals */
.attn{margin-bottom:20px;border-color:color-mix(in srgb,var(--hold) 50%,var(--line));background:var(--surface)}
.attn .panel-h{background:var(--hold-tint);border-radius:11px 11px 0 0;color:var(--hold)}
.attn .panel-h h2{font-size:14px}
.ap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 20px;padding:14px 16px;border-bottom:1px solid var(--line);align-items:start}
.ap:last-child{border-bottom:0}
.ap h3{font:600 17px/1.3 var(--serif);margin:0 0 2px}
.ap .args{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:10px 0 0;font-size:13px}
.ap .args dt{color:var(--mut)}.ap .args dd{margin:0;word-break:break-word}
.ap .acts{display:flex;flex-direction:column;gap:8px;min-width:200px}
.ap .acts .row{flex-wrap:nowrap}
.linkish{background:none;border:0;padding:0;color:var(--brand);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font:inherit}

/* calls layout */
.calls{display:grid;grid-template-columns:268px minmax(0,1fr) 340px;gap:16px;align-items:start}
.calls>.panel{height:calc(100vh - 230px);min-height:480px;display:flex;flex-direction:column;overflow:hidden}
.scroll{overflow:auto;min-height:0}
.list{display:flex;flex-direction:column}
.call{display:block;width:100%;text-align:left;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer}
.call:hover{background:var(--sunk)}
.call[aria-current=true]{background:var(--brand-tint)}
.call .l1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.call b{font-weight:600}
.call .l2{color:var(--mut);font-size:12.5px;margin-top:3px}
.call .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.ended{border-top:1px solid var(--line)}
.ended summary{padding:10px 14px;cursor:pointer;color:var(--mut)}
.ended .e{display:flex;justify-content:space-between;gap:8px;padding:7px 14px;color:var(--mut);font-size:12.5px}

.dh{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.dh .t{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap}
.dh .t h2{font:600 19px/1.2 var(--serif)}
.dh .acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.thread{flex:1;min-height:0;overflow:auto;padding:18px 18px 10px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.turn{display:flex;flex-direction:column;gap:4px;max-width:80%}
.turn.caller{align-self:flex-start}
.turn.agent,.turn.operator{align-self:flex-end;align-items:flex-end}
.who{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.bubble{padding:10px 14px;border-radius:14px;font:400 16px/1.55 var(--serif);text-wrap:pretty;overflow-wrap:anywhere}
.caller .bubble{background:var(--sunk);border-bottom-left-radius:4px}
.agent .bubble{background:var(--brand-tint);border-bottom-right-radius:4px}
.operator .bubble{background:var(--hold-tint);border-bottom-right-radius:4px}
.bubble.blocked{background:var(--bad-tint);color:var(--bad)}
.ev{align-self:center;max-width:94%}
.ev summary{display:inline-flex;align-items:center;gap:7px;padding:3px 11px;border-radius:999px;font-size:12.5px;cursor:pointer;list-style:none;border:1px solid var(--line);background:var(--surface);color:var(--mut)}
.ev summary::-webkit-details-marker{display:none}
.ev summary:hover{border-color:var(--line-strong);color:var(--tx)}
.ev.ok summary{background:var(--ok-tint);color:var(--ok);border-color:transparent}
.ev.hold summary{background:var(--hold-tint);color:var(--hold);border-color:transparent}
.ev.warn summary{background:var(--warn-tint);color:var(--warn);border-color:transparent}
.ev.bad summary{background:var(--bad-tint);color:var(--bad);border-color:transparent}
.ev .b{margin-top:6px;padding:10px 12px;background:var(--sunk);border-radius:8px;font:12px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word;color:var(--tx)}
.ev .b span{color:var(--mut)}
.typing{align-self:flex-end;padding:6px 14px;background:var(--info-tint);color:var(--info);border-radius:14px;font-size:13px;font-weight:600}
.jump{align-self:center;position:sticky;bottom:4px}
.comp{border-top:1px solid var(--line);padding:12px 16px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.held{padding:12px;border-radius:10px;background:var(--hold-tint);display:flex;flex-direction:column;gap:8px}
.held label{font-weight:600;color:var(--hold)}
.held textarea{font:400 16px/1.55 var(--serif);min-height:70px}
.say{display:flex;gap:8px;align-items:flex-end}
.say .field{flex:1}
.locked-say{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--mut)}

/* inspector */
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 8px}
.tabs button{padding:11px 10px;border:0;background:none;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500;border-radius:0}
.tabs button:hover{color:var(--tx)}
.tabs button[aria-selected=true]{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
.tabs .n{margin-left:5px;color:var(--faint);font-weight:400}
.ti{padding:14px 16px;border-bottom:1px solid var(--line)}
.ti:last-child{border-bottom:0}
.ti .h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ti .q{font:italic 400 14.5px/1.4 var(--serif);color:var(--mut);margin:3px 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lane{display:grid;grid-template-columns:62px 1fr 52px;gap:8px;align-items:center;font-size:12px;color:var(--mut);padding:2px 0}
.lane .tr{height:8px;border-radius:4px;background:var(--sunk);position:relative;overflow:hidden}
.lane .tr i{position:absolute;top:0;bottom:0;min-width:3px;border-radius:4px;background:var(--brand)}
.lane .ms{text-align:right;color:var(--tx)}
.s-vad i{background:var(--faint)!important}.s-stt i{background:var(--info)!important}.s-guardrail i{background:var(--hold)!important}
.s-llm i{background:var(--brand)!important}.s-tool i{background:var(--warn)!important}.s-tts i{background:var(--ok)!important}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:8px 0 0;font:12px/1.5 var(--mono)}
.kv dt{color:var(--mut)}.kv dd{margin:0;word-break:break-word}
.note{font-size:12.5px;color:var(--mut);padding:10px 16px;border-top:1px solid var(--line);margin-top:auto}

/* tables */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-weight:600;font-size:12px;color:var(--mut);padding:9px 14px;background:var(--surface);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right}
.tbl-wrap{overflow:auto}

/* empty / banners / toast */
.empty{display:grid;justify-items:center;text-align:center;gap:8px;padding:44px 20px;color:var(--mut)}
.empty h3{color:var(--tx);font:600 18px var(--serif)}
.empty p{margin:0;max-width:46ch;text-wrap:pretty}
.empty .row{justify-content:center;margin-top:8px}
code{font:12.5px var(--mono);background:var(--sunk);padding:1px 6px;border-radius:5px}
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:10px;font-weight:500;margin-bottom:16px}
.banner.warn{background:var(--warn-tint);color:var(--warn)}
.banner.bad{background:var(--bad-tint);color:var(--bad)}
.banner .btn{margin-left:auto}
.auth{max-width:440px;margin:6vh auto;padding:28px}
.auth h1{font-size:24px;margin:16px 0 6px}
.err{color:var(--bad);font-size:13px;min-height:1.4em}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.3s var(--ease);box-shadow:var(--shadow);z-index:30;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--bad);color:#fff}

@media (max-width:1240px){
  .calls{grid-template-columns:260px minmax(0,1fr)}
  .calls>.insp{grid-column:1/-1;height:auto;min-height:0;max-height:520px}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 12px;gap:10px 12px;border-right:0;border-bottom:1px solid var(--line)}
  .nav{flex-direction:row;overflow:auto;order:3;width:100%;padding-bottom:2px}
  .nav button{white-space:nowrap}
  .side-foot{margin:0 0 0 auto;flex-direction:row;align-items:center;position:relative}
  .access .body{position:absolute;right:0;top:100%;width:min(300px,86vw);background:var(--surface);border:1px solid var(--line);border-radius:0 0 10px 10px;z-index:15;box-shadow:var(--shadow)}
  .access summary .grow,.link-state span{display:none}
  .tools a span{display:none}
  main{padding-top:18px}
  .calls{grid-template-columns:1fr}
  .calls>.panel{height:auto;min-height:0}
  .calls>.lst{max-height:none}
  .lst .list{flex-direction:row;overflow:auto}
  .lst .call{min-width:220px;border-bottom:0;border-right:1px solid var(--line)}
  .lst .ended{display:none}
  .thread{max-height:62vh;min-height:300px}
  .turn{max-width:92%}
  .ap{grid-template-columns:1fr}
  .ap .acts{min-width:0}
  .calls>.insp{max-height:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-wave" viewBox="0 0 24 24"><path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/></symbol>
